<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PR viewer</title>
<meta name="description" content="Review GitHub pull requests the way Azure DevOps shows them: file tree, full-file diffs, side-by-side, reviewed checkboxes.">
<meta name="theme-color" content="#0f6cbd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="menu" class="icon only-phone" title="Files (t)" aria-label="Show files"><svg class="tree-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 4.5h4l1.2 1.5h4.3v3.5h-9.5z"/><path d="M5 9.5v8.5M5 12.5h3.5M5 18h3.5"/><rect x="9" y="11" width="6.5" height="3" rx=".6"/><rect x="9" y="16.5" width="6.5" height="3" rx=".6"/></svg></button>
    <a id="brand" href="#/" title="PR viewer home"><b>PR viewer</b></a>
    <form id="goto" autocomplete="off"><input id="goto-in" type="text" placeholder="Paste a GitHub PR URL…" spellcheck="false" aria-label="GitHub pull request URL"></form>
    <span id="rate" class="muted" title="GitHub API requests left"></span>
    <span id="who"></span>
    <button id="settings-btn" class="icon" title="Settings (token)" aria-label="Settings">⚙</button>
  </header>
  <div id="banner" hidden></div>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script type="module" src="app.js"></script>
</body>
</html>
