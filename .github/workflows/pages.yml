name: Deploy (GitHub Pages + Cloudflare Worker)

# Two targets from one build: GitHub Pages (hexad must stay at ref12labs.github.io/webbox/hexad/) and the Cloudflare Worker `webbox`
# (static assets, wrangler.jsonc; secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID; https://webbox.<account>.workers.dev/). The C# REPL is built once;
# stage.mjs --target=pages|cloudflare makes the two copies. Every app in this repository is static: each folder is published as it is, no build step,
# except csharp/ (C# REPL on .NET WebAssembly): its source is not copied; it is built (reference-assembly prep + dotnet publish)
# and tools/stage.mjs puts the result at _site/csharp/.
# hexad's remote app lives in the hexad repository (web/remote) and is published here at /hexad/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Read-only deploy key on Ref12/hexad; the branch is the repository variable HEXAD_REF (default main).
      - uses: actions/checkout@v4
        with:
          repository: Ref12/hexad
          ref: ${{ vars.HEXAD_REF || 'main' }}
          ssh-key: ${{ secrets.HEXAD_DEPLOY_KEY }}
          path: _hexad
          sparse-checkout: web/remote
          sparse-checkout-cone-mode: false
      - uses: actions/configure-pages@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the C# REPL
        working-directory: csharp
        run: |
          dotnet --info | head -5
          # restores Microsoft.NETCore.App.Ref (the reference assemblies PrepareRefs.cs packs) into the NuGet cache
          dotnet restore tests/CsRepl.Tests
          dotnet run tools/PrepareRefs.cs
          dotnet run tools/PrepareLazy.cs
          dotnet publish src/CsRepl.Wasm -c Release -o dist
          # experimental multithreaded runtime, only reachable with ?threads=1
          dotnet publish src/CsRepl.Wasm -c Release -p:Threads=true -p:IntermediateOutputPath=obj/mt/ -o dist-mt
      # --- fuget (NuGet package browser, .NET WebAssembly): built, not copied. Self-contained block so it merges cleanly with the csharp/ one. ---
      - name: Build fuget
        working-directory: fuget
        run: |
          dotnet run tools/PrepareRefs.cs        # reference pack -> wwwroot/ref (decompiler references, on demand)
          dotnet publish src/Fuget.Wasm -c Release -o dist
      # --- end fuget ---
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '_hexad' --exclude '/csharp' --exclude 'README.md' ./ _site/
          mkdir -p _site/hexad
          rsync -a --delete --exclude 'README.md' _hexad/web/remote/ _site/hexad/
          # csharp/ -> _site/csharp/: app files with content-hashed names, big binaries only as .br (decoded in the page; Pages cannot send Content-Encoding for them)
          node csharp/tools/stage.mjs csharp/dist/wwwroot _site/csharp --target=pages
          # fuget: publish output replaces the copied sources
          rm -rf _site/fuget && mkdir -p _site/fuget && cp -r fuget/dist/wwwroot/. _site/fuget/
          touch _site/.nojekyll
      - name: Stage the Cloudflare site
        run: |
          # same apps, but csharp/ without .br files or decoder: the edge compresses; _headers gives COOP/COEP, caching and Content-Types
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '_cf_site' --exclude '_hexad' --exclude '/csharp' --exclude 'README.md' --exclude 'wrangler.jsonc' ./ _cf_site/
          mkdir -p _cf_site/hexad
          rsync -a --delete --exclude 'README.md' _hexad/web/remote/ _cf_site/hexad/
          node csharp/tools/stage.mjs csharp/dist/wwwroot _cf_site/csharp --target=cloudflare --mt=csharp/dist-mt/wwwroot
          rm -rf _cf_site/fuget && mkdir -p _cf_site/fuget && cp -r fuget/dist/wwwroot/. _cf_site/fuget/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Deploy the Cloudflare Worker (static assets)
        # the first run creates the Worker `webbox`; nothing to set up by hand. A new app is a new folder.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
