name: Deploy (GitHub Pages + Cloudflare Worker)

# Ref12/webbox: public web tools. Two targets from one build: GitHub Pages (ref12.github.io/webbox/) and the Cloudflare Worker `webbox`
# (static assets, wrangler.jsonc; secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID; https://webbox.<account>.workers.dev/). The C# REPL is built once;
# stage.mjs --target=pages|cloudflare makes the two copies. Every app in this repository is static: each folder is published as it is, no build step,
# except the .NET WebAssembly apps (ILSpy at /ilspy/ and the Roslyn Quoter at /quoter/ are built from pinned commits of forks, not copied) csharp/ (C# REPL), fuget/ (NuGet package browser) and sharplab/ (SharpLab-style playground):
# their sources are not copied; each is built (reference-assembly prep + dotnet publish, no workloads; relink via build/NoWorkloadWasm.props) and staged at /csharp/, /fuget/ and /sharplab/.
# sharplab/tools/stage.mjs is the Pages-style staging (.br decoded in the page), used for both targets; --target=cloudflare adds the 25 MiB per-file check.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The opt-in AOT builds (?aot=1) take many minutes each: they run in a separate job (matrix, parallel), are cached on a hash of their
  # sources (rebuilt only when those change) and are handed to the deploy job as artifacts. No workload: build/NoWorkloadWasm.props
  # fetches the packs from NuGet; ~/.nuget/packages is cached on the pinned versions.
  aot:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [csharp, sharplab]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-wasm-${{ runner.os }}-${{ hashFiles('build/NoWorkloadWasm.*', 'global.json') }}-${{ matrix.app }}
          restore-keys: nuget-wasm-${{ runner.os }}-
      - id: aotcache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app }}/dist-aot
          # Only what changes the AOT _framework output: the app's C# sources and projects (not its wwwroot JS/HTML/CSS, which staging takes from the
          # relink build), its lib/ and Prepare*.cs, the shared C# projects and PrepareLazy, build/. NOT stage.mjs, config.js, e2e or this file.
          # Bump v1 when the publish flags in the build step below change.
          key: aot-v1-${{ matrix.app }}-${{ hashFiles(format('{0}/src/**', matrix.app), format('!{0}/src/**/wwwroot/**', matrix.app), format('{0}/lib/**', matrix.app), format('{0}/tools/Prepare*.cs', matrix.app), 'shared/IntelliHost/**', 'shared/Intellisense/**', 'shared/tools/**', 'build/**') }}
      - name: Build the AOT runtime
        if: steps.aotcache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.app }}
        run: |
          if [ "${{ matrix.app }}" = csharp ]; then P=CsRepl; T=CsRepl.Tests; else P=SharpLab; T=SharpLab.Tests; fi
          dotnet restore tests/$T
          dotnet run tools/PrepareRefs.cs
          dotnet run tools/PrepareLazy.cs
          dotnet publish src/$P.Wasm -c Release -p:NoWorkloadWasmAot=true -p:PublishTrimmed=true -p:IntermediateOutputPath=obj/aot/ -o dist-aot
      - uses: actions/upload-artifact@v4
        with:
          name: aot-${{ matrix.app }}
          path: ${{ matrix.app }}/dist-aot
          retention-days: 1
  deploy:
    needs: aot
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-wasm-${{ runner.os }}-${{ hashFiles('build/NoWorkloadWasm.*', 'global.json') }}-main
          restore-keys: nuget-wasm-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: aot-csharp
          path: csharp/dist-aot
      - uses: actions/download-artifact@v4
        with:
          name: aot-sharplab
          path: sharplab/dist-aot
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the C# REPL
        working-directory: csharp
        run: |
          dotnet --info | head -5
          # restores Microsoft.NETCore.App.Ref (the reference assemblies PrepareRefs.cs packs) into the NuGet cache
          dotnet restore tests/CsRepl.Tests
          dotnet run tools/PrepareRefs.cs
          dotnet run tools/PrepareLazy.cs
          dotnet publish src/CsRepl.Wasm -c Release -o dist
          # experimental multithreaded runtime, only reachable with ?threads=1
          dotnet publish src/CsRepl.Wasm -c Release -p:Threads=true -p:IntermediateOutputPath=obj/mt/ -o dist-mt
      # --- fuget (NuGet package browser, .NET WebAssembly): built, not copied. Self-contained block so it merges cleanly with the csharp/ one. ---
      - name: Build fuget
        working-directory: fuget
        run: |
          dotnet run tools/PrepareRefs.cs        # reference pack -> wwwroot/ref (decompiler references, on demand)
          dotnet publish src/Fuget.Wasm -c Release -o dist
      # --- end fuget ---
      - name: Build SharpLab
        working-directory: sharplab
        run: |
          # restores Microsoft.NETCore.App.Ref (the reference assemblies PrepareRefs.cs packs) into the NuGet cache
          dotnet restore tests/SharpLab.Tests
          dotnet run tools/PrepareRefs.cs
          dotnet run tools/PrepareLazy.cs        # IntelliSense assemblies -> wwwroot/lazy (shared/Intellisense, fetched after first paint)
          dotnet publish src/SharpLab.Wasm -c Release -o dist
      # --- ILSpy in the browser (Avalonia, .NET WebAssembly): built from a pinned commit of the fork ljcollins25/ILSpy (branch browser), not copied ---
      # The output is cached by the pinned commit: it rebuilds only when the pin changes (bump ILSPY_REF), not on every deploy.
      - name: Cache the ILSpy build
        id: ilspy-cache
        uses: actions/cache@v4
        with:
          path: |
            _ilspy_pages
            _ilspy_cf
            _ilspy_headers
          key: ilspy-v1-f83873649e14fba7034f0cc0447069b7366445d5
      - name: Check out ILSpy
        if: steps.ilspy-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ljcollins25/ILSpy
          ref: f83873649e14fba7034f0cc0447069b7366445d5
          path: ilspy-src
      - name: Build ILSpy
        if: steps.ilspy-cache.outputs.cache-hit != 'true'
        run: |
          ilspy-src/ILSpy.Browser/build-static.sh "$PWD/_ilspy_pages" --target=pages
          ilspy-src/ILSpy.Browser/build-static.sh "$PWD/_ilspy_cf" --target=cloudflare --base=/ilspy --headers="$PWD/_ilspy_headers"
      # --- MSBuild Structured Log Viewer in the browser (Avalonia, .NET WebAssembly): pinned commit of the fork ljcollins25/MSBuildStructuredLog (branch wasm), cached by the pin ---
      - name: Cache the binlog viewer build
        id: binlog-cache
        uses: actions/cache@v4
        with:
          path: |
            _binlog_pages
            _binlog_cf
            _binlog_headers
          key: binlog-v1-849dc67a7998d2dc377290b305838ad8ed3e6213
      - name: Check out MSBuildStructuredLog
        if: steps.binlog-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ljcollins25/MSBuildStructuredLog
          fetch-depth: 0   # Nerdbank.GitVersioning computes the version from history; a shallow clone fails the build
          ref: 849dc67a7998d2dc377290b305838ad8ed3e6213
          path: binlog-src
      - name: Build the binlog viewer
        if: steps.binlog-cache.outputs.cache-hit != 'true'
        run: |
          binlog-src/src/StructuredLogViewer.Browser/build-static.sh "$PWD/_binlog_pages" --target=pages
          binlog-src/src/StructuredLogViewer.Browser/build-static.sh "$PWD/_binlog_cf" --target=cloudflare --base=/binlog --headers="$PWD/_binlog_headers"
      # --- Roslyn Quoter (browser-only, .NET WebAssembly): built from a pinned commit of the fork ljcollins25/RoslynQuoter (branch browser), not copied ---
      # Cached by the pinned commit and webbox's shared build files (it builds with build/NoWorkloadWasm.*).
      - name: Cache the Roslyn Quoter build
        id: quoter-cache
        uses: actions/cache@v4
        with:
          path: quoter-dist
          key: quoter-v1-5c3566265e4a401a1c31864350b48562edd373ef-${{ hashFiles('build/NoWorkloadWasm.props', 'build/NoWorkloadWasm.targets') }}
      - name: Check out the Roslyn Quoter
        if: steps.quoter-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ljcollins25/RoslynQuoter
          ref: 5c3566265e4a401a1c31864350b48562edd373ef
          path: quoter-src
      - name: Build the Roslyn Quoter
        if: steps.quoter-cache.outputs.cache-hit != 'true'
        run: WEBBOX_DIR="$PWD" quoter-src/src/Quoter.Browser/build-static.sh "$PWD/quoter-dist"
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '/csharp' --exclude '/sharplab' --exclude '/ilspy-src' --exclude '/_ilspy_pages' --exclude '/_ilspy_cf' --exclude '/_ilspy_headers' --exclude '/quoter-src' --exclude '/quoter-dist' --exclude '/binlog-src' --exclude '/_binlog_pages' --exclude '/_binlog_cf' --exclude '/_binlog_headers' --exclude 'README.md' ./ _site/
          # csharp/ -> _site/csharp/: app files with content-hashed names, big binaries only as .br (decoded in the page; Pages cannot send Content-Encoding for them)
          node csharp/tools/stage.mjs csharp/dist/wwwroot _site/csharp --target=pages --aot=csharp/dist-aot/wwwroot
          # fuget: publish output replaces the copied sources
          rm -rf _site/fuget && mkdir -p _site/fuget && cp -r fuget/dist/wwwroot/. _site/fuget/
          node sharplab/tools/stage.mjs sharplab/dist/wwwroot _site/sharplab --aot=sharplab/dist-aot/wwwroot
          mkdir -p _site/ilspy && cp -r _ilspy_pages/. _site/ilspy/
          rm -rf _site/quoter && cp -r quoter-dist _site/quoter
          mkdir -p _site/binlog && cp -r _binlog_pages/. _site/binlog/
          touch _site/.nojekyll
      - name: Stage the Cloudflare site
        run: |
          # same apps, but csharp/ without .br files or decoder: the edge compresses; _headers gives COOP/COEP, caching and Content-Types
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude '_cf_site' --exclude '/csharp' --exclude '/sharplab' --exclude '/ilspy-src' --exclude '/_ilspy_pages' --exclude '/_ilspy_cf' --exclude '/_ilspy_headers' --exclude '/quoter-src' --exclude '/quoter-dist' --exclude '/binlog-src' --exclude '/_binlog_pages' --exclude '/_binlog_cf' --exclude '/_binlog_headers' --exclude 'README.md' --exclude 'wrangler.jsonc' ./ _cf_site/
          node csharp/tools/stage.mjs csharp/dist/wwwroot _cf_site/csharp --target=cloudflare --mt=csharp/dist-mt/wwwroot --aot=csharp/dist-aot/wwwroot
          rm -rf _cf_site/fuget && mkdir -p _cf_site/fuget && cp -r fuget/dist/wwwroot/. _cf_site/fuget/
          node sharplab/tools/stage.mjs sharplab/dist/wwwroot _cf_site/sharplab --target=cloudflare --aot=sharplab/dist-aot/wwwroot
          mkdir -p _cf_site/ilspy && cp -r _ilspy_cf/. _cf_site/ilspy/
          cat _ilspy_headers >> _cf_site/_headers    # after csharp's stage.mjs wrote _headers
          rm -rf _cf_site/quoter && cp -r quoter-dist _cf_site/quoter
          mkdir -p _cf_site/binlog && cp -r _binlog_cf/. _cf_site/binlog/
          cat _binlog_headers >> _cf_site/_headers
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Deploy the Cloudflare Worker (static assets)
        # the first run creates the Worker `webbox`; nothing to set up by hand. A new app is a new folder.
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
