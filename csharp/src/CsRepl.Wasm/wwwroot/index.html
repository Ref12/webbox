<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C# interactive (.NET WebAssembly)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <strong>C# interactive</strong> <span class="dim">Roslyn on .NET WebAssembly &mdash; compiled, completed and run in your browser</span>
  <span id="intelli" class="badge" title="IntelliSense (Roslyn Features) loads after the first paint">IntelliSense: waiting</span>
  <label class="aot" title="AOT build: about twice the download, but compiles and runs code 2-8x faster. Remembered; ?aot=1 / ?aot=0 overrides."><input type="checkbox" id="aot"> AOT</label>
  <span id="status" class="status">loading&hellip;</span>
</header>
<main>
  <section id="transcript" aria-live="polite"></section>
  <section id="input">
    <div id="editor"></div>
    <div class="bar">
      <button id="run" disabled>&#9654; Run</button>
      <button id="stop" hidden title="Stop the running code (Ctrl+C): restarts the runtime and replays the session">&#9632; Stop</button>
      <button id="reset" disabled>Reset session</button>
      <span class="dim hint">Enter runs when complete &middot; Shift+Enter newline &middot; Ctrl+&uarr;/&darr; history &middot; <code>#r "nuget: Pkg, ver"</code> &middot; <code>#help</code></span>
    </div>
  </section>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
